<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission Debug</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Handjet:wght@300;400;700&family=Jersey+25&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="screen">
      <div class="face">:(</div>

      <h1 class="title">System failure detected!</h1>

      <p class="message">
        Your system ran into a serious problem. The website is currently
        broken.<br />
        Our developers need your help to fix it.<br />
        Can you repair the code?
      </p>

      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>

      <div class="percent">0%</div>

      <div class="stop-code">STOP CODE: INCOMPATIBLE_VISITOR</div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
